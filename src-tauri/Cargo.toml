
[package]
name = "netwarga"
version = "0.1.0"
description = "Net Warga - Network Management System"
authors = ["Net Warga"]
edition = "2024"

[lib]
name = "netwarga_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = [] }
tauri-plugin-opener = "2"

serde = { version = "1", features = ["derive"] }
serde_json = "1"

# Database
rusqlite = { version = "0.37", features = ["bundled"] }

# Async runtime and networking
tokio = { version = "1", features = ["net", "io-util", "time", "sync", "macros"] }

# Error handling
thiserror = "2"
num-bigint = "0.5.1"
num-traits = "0.2.19"

[profile.release]
codegen-units = 1
lto = true
opt-level = 3
panic = "abort"
strip = true
